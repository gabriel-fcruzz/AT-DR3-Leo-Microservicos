# Profile docker: dentro do compose o Eureka é alcançado pelo nome do container.
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

# Dentro do compose o Zipkin é alcançado pelo nome do container.
management:
  tracing:
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
