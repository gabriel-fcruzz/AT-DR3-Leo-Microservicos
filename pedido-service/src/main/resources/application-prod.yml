# Profile prod: integração real (Eureka + Feign + catálogo no ar). Use para testar o fluxo completo.
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    openfeign:
      client:
        config:
          # Timeout (resiliência): o chamador não fica preso esperando o catálogo.
          catalogo-service:
            connect-timeout: 5000
            read-timeout: 5000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
