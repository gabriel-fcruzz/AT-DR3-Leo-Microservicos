spring:
  application:
    name: catalogo-service

  datasource:
    url: jdbc:postgresql://localhost:5433/catalogo
    username: catalogo
    password: catalogo
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  elasticsearch:
    uris: http://localhost:9200

  kafka:
    bootstrap-servers: localhost:9092
    # Tracing do Kafka (off por padrão no Spring Boot): liga a observação no listener
    # para o consumidor CONTINUAR o trace (lê o traceId dos headers da mensagem).
    listener:
      observation-enabled: true
    consumer:
      group-id: catalogo-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Aceita o JSON do produtor e desserializa sempre na classe local (ignora o header de tipo).
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: br.com.farmaciadelivery.catalogo_service.service.kafka.events.PedidoCriadoEvento

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Observabilidade: expõe métricas em /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  # Tracing (TP3): amostra 100% dos traces e exporta os spans ao Zipkin.
  # Ao consumir o evento Kafka, o consumo CONTINUA o trace que nasceu no gateway (mesmo traceId).
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans

# Log com o traceId/spanId REAIS do OpenTelemetry (via MDC, preenchidos automaticamente).
# O traceId do OTel supera o correlationId manual: ele nasce no gateway e atravessa HTTP/Feign/Kafka.
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}]"
