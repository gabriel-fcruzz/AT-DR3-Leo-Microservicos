# Profile docker: dentro do compose os hosts são nomes de container (não localhost).
spring:
  datasource:
    url: jdbc:postgresql://postgres-catalogo:5432/catalogo
  elasticsearch:
    uris: http://elasticsearch:9200
  kafka:
    bootstrap-servers: kafka:29092

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

# Dentro do compose o Zipkin é alcançado pelo nome do container.
management:
  tracing:
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
